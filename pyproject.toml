[project]
name = "banking-copilot"
version = "0.1.0"
description = "LLM copilot for bank staff comparing RAG, function calling and MCP with banking-grade controls"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "mcp>=1.2,<2",  # v1 FastMCP API (2.x renamed it to MCPServer), see docs/decisions.md
    "faker>=28",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the Postgres database (skipped if unreachable)"]
